# Optional service-only GitHub HTTPS transport using existing gh credentials.
# Requires /usr/bin/gh; adjust the helper path if gh is installed elsewhere.
[Service]
Environment=GH_PROMPT_DISABLED=1
Environment=GIT_CONFIG_COUNT=3
Environment=GIT_CONFIG_KEY_0=url.https://github.com/.insteadOf
Environment=GIT_CONFIG_VALUE_0=git@github.com:
Environment=GIT_CONFIG_KEY_1=credential.https://github.com.helper
Environment=GIT_CONFIG_VALUE_1=
Environment=GIT_CONFIG_KEY_2=credential.https://github.com.helper
Environment="GIT_CONFIG_VALUE_2=!/usr/bin/gh auth git-credential"
UnsetEnvironment=SSH_AUTH_SOCK SSH_AGENT_PID
